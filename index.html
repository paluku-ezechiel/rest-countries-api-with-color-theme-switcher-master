<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/styles/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/6b27567aa1.js"
      crossorigin="anonymous"
    ></script>
    <title>Rest countries</title>
  </head>
  <body>
    <header class="container">
      <h1>Where in the world?</h1>
      <div class="mode-dark" role="button" aria-label="Toggle dark mode">
        <i class="fa-solid fa-moon"></i>
        <span class="dark-texte">Dark Mode</span>
      </div>
    </header>

    <main>
      <section class="search-All">
        <div class="input-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="text"
            id="search-input"
            name="search"
            placeholder="Search for a country..."
            aria-label="search for a country"
          />
        </div>
        <div class="select-country">
          <select id="region-filter" aria-label="Filter by Region">
            <option value="" disabled selected hidden>Filter by Region</option>
            <option value="Africa">Africa</option>
            <option value="Americas">Americas</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="Oceania">Oceania</option>
          </select>
        </div>
      </section>
      <section class="countries">
        <!-- <div class="countries-elements">
          <div class="image-country">
            <img
              src="https://flagcdn.com/ad.svg"
              alt="Drapeau de l'Allemagne"
            />
          </div>
          <div class="title-country">
            <h2 class="title">Germany</h2>
            <p class="population">
              <strong>Population:</strong> <span>83 240 525</span>
            </p>
            <p class="region">
              <strong>Region:</strong> <span>Europe</span>
            </p>
            <p class="capital"><strong>Capital:</strong> <span>Berlin</span></p>
          </div>
        </div> -->
      </section>
    </main>
    <script src="./assets/js/index.js"></script>
  </body>
</html>
